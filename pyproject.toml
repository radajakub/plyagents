[project]
name = "game-agents"
version = "0.1.0"
description = "Agentic and LLM approaches to solving simple games, benchmarked on PlyBench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "plybench[all]>=2.0.0",
    "torch>=2.4.0",
]

# torch arrives via plybench[huggingface] for local embedding models; the PyPI linux wheel drags in
# the whole CUDA stack (~5 GB), so linux resolves the CPU build instead. macOS wheels are CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_agents"]

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
