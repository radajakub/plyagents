[project]
name = "plyagents"
version = "0.1.0"
description = "Agentic and LLM approaches to playing simple games, evaluated with plybench."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jakub Rada", email = "dev.jakubrada@icloud.com" }]
dependencies = [
    "plybench[api,viz]>=4.11.2,<5",
    "plyllm>=1.7.0,<2",
]

[project.entry-points."plybench.players"]
tac = "plyagents.tac.register:register_players"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plyagents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py313"

[tool.ruff.lint]
# Minimal set, as in plybench: pyflakes (F), essential pycodestyle errors (E4/E7/E9), import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pyright>=1.1.414",
]
